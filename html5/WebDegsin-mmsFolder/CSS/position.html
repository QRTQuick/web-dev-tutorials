<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>position html</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .body{
            height: 2000px;
        }
        .box {
            width: 100px;
            height: 100px;
            margin: 20px;
            font-size: 40px;
            text-align: center;
            line-height: 90px;
        }

        .position1 {
            background: red;
            color: white;
            position: fixed;
        }

        .position2 {
            background: blue;
            color: white;
            /* position: relative; */
          
        }

        /* .position2:hover {
            background: blue;
            color: white;
            position: relative;
              right: 20px;
            bottom: 50px;
        } */

        .outer {
            width: 400px;
            height: 400px;
            /* position: relative; */
            border: 2px solid black;
        }

        .position3 {
            background-color: yellow;
            position: absolute;
            top: 0px;
            /* left: 0px; */
            right: 0px;

        }
    </style>
</head>

<body>
    <div class="box position1"> one</div>
    <div class="box position2"> two</div>
    <div class="outer">
        <div class="box position3"> three </div>
    </div> 
    
</body>
</html>
