<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>transitionhtmlhtml</title>
    <style>
        .box {
            width: 100px;
            height: 100px;
            background: red;
            transition: 200ms all linear(-0.23 28.64%, 1.26-9.41%, 0.75 38.16%, 0.35 13.89%, 0.04 69.7%, 1 100%) ;
        }

        .box:hover {
            background: blue;
            width: 200px;
        }
    </style>
</head>

<body>
    <div class="box"></div>
</body>

</html>
