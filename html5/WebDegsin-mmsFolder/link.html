<!DOCTYPE html>
<html>

<head>
    <title>link in Html</title>
</head>

<body>
    <!--
    in html we have 2 types of link
    1. relative link
       this are links found in our local storage 
       therefore you do not need internet 
       connectivity to access them
    2. absolute link
         this are links found on the 
         internet and you need internet 
         connectivity to access them
        Attributes
         its a key word that gives us more information about the element
         
         they are always found in the opening tag of the element

         We have more than one atttribute in an elempent

         They are not visible in the browser

    -->
    <!-- relative link -->
    <a href="index.html" target="_blank">INDEX</a>
    <a href="index2.html" target="_blank">INDEX2</a>
    <a href="list.html" target="_blank">LIST</a>
    <!-- absolute link -->
    <a href="https://www.youtube.com" target="_blank">YouTube</a>
</body>

</html>
